<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grow Study - User Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0610 0%, #150f21 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* Premium Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(13, 9, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(214, 121, 255, 0.15);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Custom Logo Area */
        .custom-logo {
            height: 42px;
            width: 42px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #6c32c9;
            box-shadow: 0 0 10px rgba(108, 50, 201, 0.5);
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(90deg, #ffffff, #d679ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0px 4px 15px rgba(214, 121, 255, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn-icon {
            background: rgba(24, 18, 36, 0.6);
            border: 1px solid rgba(214, 121, 255, 0.2);
            color: #fff;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-icon:hover {
            background: #1f1433;
            box-shadow: 0 0 15px rgba(214, 121, 255, 0.2);
        }

        /* Premium Tabs */
        .tabs {
            display: flex;
            gap: 15px;
            padding: 25px 20px 15px 20px;
        }

        .tab {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #888;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 10px 18px;
            border-radius: 14px;
        }

        .tab:hover {
            color: #ddd;
        }

        .tab.active {
            color: #fff;
            background: linear-gradient(145deg, #1f1433, #2d1b4e);
            border: 1px solid #6c32c9;
            box-shadow: 0 8px 20px rgba(108, 50, 201, 0.25);
        }

        .badge {
            background: linear-gradient(90deg, #a450ff, #d679ff);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #fff;
            font-weight: 700;
        }

        /* Glowing Search Bar */
        .search-container {
            padding: 0 20px 25px 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            transition: 0.3s;
        }

        .search-box input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border-radius: 14px;
            background: rgba(20, 15, 29, 0.8);
            border: 1px solid rgba(214, 121, 255, 0.15);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .search-box input:focus {
            background: rgba(25, 17, 38, 0.9);
            border-color: #a450ff;
            box-shadow: 0 0 20px rgba(164, 80, 255, 0.2);
        }

        .search-box input:focus + i {
            color: #d679ff;
        }

        /* 3D Batch Cards */
        .batches-container {
            padding: 0 20px 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .batch-card {
            background: linear-gradient(180deg, #181224 0%, #110c1a 100%);
            border: 1px solid rgba(214, 121, 255, 0.1);
            border-radius: 18px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .batch-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(164, 80, 255, 0.15);
            border: 1px solid rgba(214, 121, 255, 0.3);
        }

        .card-img {
            position: relative;
            width: 100%;
            height: 190px;
            background-color: #231b32;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .batch-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(108, 50, 201, 0.9);
            backdrop-filter: blur(5px);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-content {
            padding: 18px;
        }

        .card-title {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.5;
            font-weight: 600;
            color: #f8f8f8;
        }

        .card-actions {
            display: flex;
            gap: 15px;
        }

        .btn-enroll {
            flex: 1;
            background: linear-gradient(90deg, #9b4dff, #d679ff);
            border: none;
            color: white;
            padding: 12px 0;
            border-radius: 25px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(164, 80, 255, 0.3);
        }

        .btn-enroll:active {
            transform: scale(0.96);
        }

        .btn-enroll.enrolled-style {
            background: rgba(164, 80, 255, 0.1);
            border: 1px solid rgba(214, 121, 255, 0.5);
            color: #d679ff;
            box-shadow: none;
        }

        .btn-study {
            flex: 1;
            background: #ffffff;
            border: none;
            color: #0d0914;
            padding: 12px 0;
            border-radius: 25px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-study:active {
            transform: scale(0.96);
        }
        
        .btn-study:hover {
            background: #f0f0f0;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        /* Premium Empty/Loading Messages */
        .empty-message {
            text-align: center;
            color: #666;
            padding: 50px 20px;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        
        .empty-message i {
            font-size: 2.5rem;
            color: #444;
            margin-bottom: 15px;
            display: block;
        }
        
        .loading-message {
            text-align: center;
            color: #d679ff;
            padding: 50px 0;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">
            <!-- YAHAN APNI LOGO KI IMAGE KA URL DAALO -->
            <img src="https://cdn.phototourl.com/member/2026-10-28-a059390e-4acb-4eb2-bd5d-6fc3c3bd4cef.png" alt="Logo" class="custom-logo" id="mainLogo">
            
            <!-- Ye wahi Grow Study text hai jo tumne likha tha -->
            <span class="logo-text">GROW STUDY</span>
        </div>
        <div class="header-actions">
            <button class="btn-icon"><i class="far fa-bookmark"></i></button>
        </div>
    </header>

    <div class="tabs">
        <button class="tab active" id="tabLatest" onclick="switchTab('latest')">
            <i class="fas fa-sparkles"></i> Latest <span class="badge" id="latestCount">0</span>
        </button>
        <button class="tab" id="tabEnrolled" onclick="switchTab('enrolled')">
            <i class="far fa-bookmark"></i> Enrolled
        </button>
    </div>

    <div class="search-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search for your batches..." onkeyup="searchBatches()">
        </div>
    </div>

    <div class="batches-container" id="batchesList">
        <div class="loading-message"><i class="fas fa-spinner fa-spin"></i> Loading Batches...</div>
    </div>

    <script>
        // Firebase Configuration (DO NOT CHANGE)
        const firebaseConfig = {
            apiKey: "AIzaSyBwXQ_vStlNSvx4048zrVzekliiP6pObHc",
            authDomain: "batches-89643.firebaseapp.com",
            databaseURL: "https://batches-89643-default-rtdb.firebaseio.com",
            projectId: "batches-89643",
            storageBucket: "batches-89643.firebasestorage.app",
            messagingSenderId: "1056478644801",
            appId: "1:1056478644801:web:04de6c7a877bc5c2dd14c0"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const batchesRef = db.ref('batches');

        let batchesData = [];
        let currentTab = 'latest'; 

        const batchesContainer = document.getElementById('batchesList');
        const tabLatest = document.getElementById('tabLatest');
        const tabEnrolled = document.getElementById('tabEnrolled');
        const latestCount = document.getElementById('latestCount');

        // Fetch Data from Firebase Realtime Database
        batchesRef.on('value', (snapshot) => {
            batchesData = [];
            snapshot.forEach((childSnapshot) => {
                let data = childSnapshot.val();
                data.id = childSnapshot.key; 
                // Check local storage for enrollment
                data.enrolled = localStorage.getItem('enrolled_' + data.id) === 'true'; 
                batchesData.push(data);
            });
            // Reverse so newest is on top
            batchesData.reverse();
            renderBatches(document.getElementById('searchInput').value.toLowerCase());
        });

        function switchTab(tabName) {
            currentTab = tabName;
            
            if(tabName === 'latest') {
                tabLatest.classList.add('active');
                tabEnrolled.classList.remove('active');
            } else {
                tabEnrolled.classList.add('active');
                tabLatest.classList.remove('active');
            }
            
            document.getElementById('searchInput').value = '';
            renderBatches();
        }

        function searchBatches() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderBatches(query);
        }

        function renderBatches(searchQuery = "") {
            batchesContainer.innerHTML = ''; 
            latestCount.innerText = batchesData.length;

            let filteredData = batchesData;
            if (currentTab === 'enrolled') {
                filteredData = batchesData.filter(batch => batch.enrolled === true);
            }

            if (searchQuery !== "") {
                filteredData = filteredData.filter(batch => batch.title.toLowerCase().includes(searchQuery));
            }

            // Premium Empty State Design
            if (filteredData.length === 0) {
                const emptyText = currentTab === 'enrolled' 
                    ? "You haven't enrolled in any batches yet." 
                    : "No batches found.";
                batchesContainer.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-box-open"></i>
                        ${emptyText}
                    </div>`;
                return;
            }

            filteredData.forEach(batch => {
                const enrollBtnClass = batch.enrolled ? "btn-enroll enrolled-style" : "btn-enroll";
                const enrollText = batch.enrolled ? `<i class="fas fa-check-circle"></i> ENROLLED` : `<i class="fas fa-plus"></i> ENROLL`;

                const batchHTML = `
                    <div class="batch-card">
                        <div class="card-img">
                            <span class="batch-badge">BATCH</span>
                            <img src="${batch.imageUrl}" alt="Batch Image" onerror="this.src='https://via.placeholder.com/600x300/181224/ffffff?text=Image+Not+Found'">
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${batch.title}</h3>
                            <div class="card-actions">
                                <button class="${enrollBtnClass}" onclick="toggleEnroll('${batch.id}')">
                                    ${enrollText}
                                </button>
                                <button class="btn-study" onclick="goToStudy('${batch.studyLink}')">
                                    STUDY <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                batchesContainer.innerHTML += batchHTML;
            });
        }

        function goToStudy(link) {
            window.location.href = link; 
        }

        function toggleEnroll(id) {
            const batchIndex = batchesData.findIndex(b => b.id === id);
            if(batchIndex !== -1) {
                batchesData[batchIndex].enrolled = !batchesData[batchIndex].enrolled;
                localStorage.setItem('enrolled_' + id, batchesData[batchIndex].enrolled);
                renderBatches(document.getElementById('searchInput').value.toLowerCase()); 
            }
        }
    </script>
</body>
</html>
